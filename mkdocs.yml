site_name: Product Service - Nathan
site_description: API REST de catálogo de produtos com cache Redis e métricas Prometheus, documentação individual do microsserviço Product — Insper 2026.1.
site_author: Nathan David Pecher Benaion
site_url: https://microservice-henry.github.io/pma.261.product/
repo_url: https://github.com/microservice-henry/pma.261.product
repo_name: microservice-henry/pma.261.product

theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Home: index.md
  - API Reference: api.md
  - Architecture: architecture.md
  - Bottlenecks: bottlenecks.md
  - Development: development.md
